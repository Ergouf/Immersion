name: Backfill v0.5.0 APK

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release.yml'

permissions:
  contents: write

concurrency:
  group: backfill-v0.5.0
  cancel-in-progress: false

jobs:
  release:
    name: Rebuild and publish v0.5.0 APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout v0.5.0 source
        uses: actions/checkout@v4
        with:
          ref: v0.5.0
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify v0.5.0 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(node -p "require('./package.json').version")" = "0.5.0"
          npm run verify
          npm run lint
          npm run doctor

      - name: Verify Android and iOS bundles
        run: |
          npx expo export --platform android --output-dir dist-native --clear
          npx expo export --platform ios --output-dir dist-ios --clear

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Prepare Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for required in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required GitHub Secret: ${required}" >&2
              exit 1
            fi
          done
          signing_file="$RUNNER_TEMP/immersion-upload.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          test -s "$signing_file"
          {
            echo "IMMERSION_SIGNING_STORE_FILE=$signing_file"
            echo "IMMERSION_SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "IMMERSION_SIGNING_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "IMMERSION_SIGNING_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            "-Pandroid.injected.signing.store.file=$IMMERSION_SIGNING_STORE_FILE" \
            "-Pandroid.injected.signing.store.password=$IMMERSION_SIGNING_STORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$IMMERSION_SIGNING_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$IMMERSION_SIGNING_KEY_PASSWORD"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          apk_name="Immersion-v0.5.0-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/$apk_name"
          (cd release-assets && sha256sum "$apk_name" > "$apk_name.sha256")
          echo "RELEASE_APK=release-assets/$apk_name" >> "$GITHUB_ENV"
          echo "RELEASE_CHECKSUM=release-assets/$apk_name.sha256" >> "$GITHUB_ENV"

      - name: Create or update v0.5.0 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view v0.5.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create v0.5.0 --repo "$GITHUB_REPOSITORY" --title "Immersion v0.5.0" --generate-notes --verify-tag --prerelease
          else
            gh release edit v0.5.0 --repo "$GITHUB_REPOSITORY" --title "Immersion v0.5.0" --prerelease
          fi
          gh release upload v0.5.0 "$RELEASE_APK" "$RELEASE_CHECKSUM" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/immersion-upload.p12"
