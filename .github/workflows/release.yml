name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build or backfill, for example v0.5.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Validate, build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release tag
        shell: bash
        env:
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            release_tag="$MANUAL_TAG"
          else
            release_tag="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag must look like v0.5.0 or v0.5.0-beta.1; got: $tag" >&2
            exit 1
          fi

          tag_version="${tag#v}"
          package_version="$(node -p "require('./package.json').version")"
          if [[ "$tag_version" != "$package_version" ]]; then
            echo "Tag version ($tag_version) does not match package.json ($package_version)." >&2
            exit 1
          fi

      - name: Verify source and tests
        run: npm run verify

      - name: Lint source
        run: npm run lint

      - name: Check Expo project health
        run: npm run doctor

      - name: Verify Android and iOS bundles
        run: |
          npx expo export --platform android --output-dir dist-native --clear
          npx expo export --platform ios --output-dir dist-ios --clear

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Prepare Android release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for required in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required GitHub Secret: ${required}" >&2
              exit 1
            fi
          done

          signing_file="$RUNNER_TEMP/immersion-upload.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          test -s "$signing_file"
          {
            echo "IMMERSION_SIGNING_STORE_FILE=$signing_file"
            echo "IMMERSION_SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "IMMERSION_SIGNING_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "IMMERSION_SIGNING_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android release APK
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            "-Pandroid.injected.signing.store.file=$IMMERSION_SIGNING_STORE_FILE" \
            "-Pandroid.injected.signing.store.password=$IMMERSION_SIGNING_STORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$IMMERSION_SIGNING_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$IMMERSION_SIGNING_KEY_PASSWORD"

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets
          apk_name="Immersion-${RELEASE_TAG}-android.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "release-assets/$apk_name"
          (
            cd release-assets
            sha256sum "$apk_name" > "$apk_name.sha256"
          )
          {
            echo "RELEASE_APK=release-assets/$apk_name"
            echo "RELEASE_CHECKSUM=release-assets/$apk_name.sha256"
          } >> "$GITHUB_ENV"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$RELEASE_TAG"
          prerelease=false
          if [[ "$tag" == v0.* || "$tag" == *-* ]]; then
            prerelease=true
          fi

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; assets will be replaced idempotently."
            if [[ "$prerelease" == true ]]; then
              gh release edit "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --title "Immersion $tag" \
                --prerelease
            fi
          else
            args=(
              "$tag"
              --repo "$GITHUB_REPOSITORY"
              --title "Immersion $tag"
              --generate-notes
              --verify-tag
            )
            if [[ "$prerelease" == true ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          fi

          gh release upload "$tag" \
            "$RELEASE_APK" \
            "$RELEASE_CHECKSUM" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Summarize release
        if: success()
        shell: bash
        run: |
          {
            echo '## Immersion release published'
            echo "- Tag: $RELEASE_TAG"
            echo "- Android: $(basename "$RELEASE_APK")"
            echo "- Checksum: $(basename "$RELEASE_CHECKSUM")"
            echo '- iOS: bundle validation passed; no installable IPA is produced by this Linux workflow.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/immersion-upload.p12"
