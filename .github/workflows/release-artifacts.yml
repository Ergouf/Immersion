name: Validate app and build main APK

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freshness:
    name: Decide whether a build is needed
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decision.outputs.should_run }}
    steps:
      - name: Check current main APK artifact on scheduled runs
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "$GITHUB_EVENT_NAME" != "schedule" ]]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          artifact_name="immersion-signed-apk-${GITHUB_SHA}"
          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}"
          count="$(
            curl --fail --silent --show-error --location \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api_url" \
            | python3 -c 'import json, sys; print(json.load(sys.stdin).get("total_count", 0))'
          )"

          if [[ "$count" -gt 0 ]]; then
            echo "APK artifact already exists for ${GITHUB_SHA}; scheduled run will stop here."
            echo "should_run=false" >> "$GITHUB_OUTPUT"
          else
            echo "No APK artifact exists for ${GITHUB_SHA}; scheduled run will backfill it."
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: Validate Expo app and build main APK
    needs: freshness
    if: needs.freshness.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and tests
        run: npm run verify

      - name: Lint source
        run: npm run lint

      - name: Check Expo project health
        run: npm run doctor

      - name: Export Android and iOS bundles
        run: |
          npx expo export --platform android --output-dir dist-native --clear
          npx expo export --platform ios --output-dir dist-ios --clear

      - name: Set up Java for signed APK
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.head_ref == 'agent/apk-build')
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate Android native project
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.head_ref == 'agent/apk-build')
        run: npx expo prebuild --platform android --no-install

      - name: Prepare Android release signing
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.head_ref == 'agent/apk-build')
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          for required in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required GitHub Secret: ${required}" >&2
              exit 1
            fi
          done

          signing_file="$RUNNER_TEMP/immersion-upload.p12"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          test -s "$signing_file"
          {
            echo "IMMERSION_SIGNING_STORE_FILE=$signing_file"
            echo "IMMERSION_SIGNING_STORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD"
            echo "IMMERSION_SIGNING_KEY_ALIAS=$ANDROID_KEY_ALIAS"
            echo "IMMERSION_SIGNING_KEY_PASSWORD=$ANDROID_KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build signed Android release APK
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.head_ref == 'agent/apk-build')
        working-directory: android
        run: |
          ./gradlew :app:assembleRelease --no-daemon --stacktrace \
            "-Pandroid.injected.signing.store.file=$IMMERSION_SIGNING_STORE_FILE" \
            "-Pandroid.injected.signing.store.password=$IMMERSION_SIGNING_STORE_PASSWORD" \
            "-Pandroid.injected.signing.key.alias=$IMMERSION_SIGNING_KEY_ALIAS" \
            "-Pandroid.injected.signing.key.password=$IMMERSION_SIGNING_KEY_PASSWORD"

      - name: Verify APK signature
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.head_ref == 'agent/apk-build')
        shell: bash
        run: |
          set -euo pipefail
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs android/app/build/outputs/apk/release/app-release.apk

      - name: Prepare signed APK artifact
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.head_ref == 'agent/apk-build')
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          short_sha="${GITHUB_SHA::7}"
          apk_name="Immersion-${version}-${short_sha}-android.apk"
          mkdir -p signed-apk
          cp android/app/build/outputs/apk/release/app-release.apk "signed-apk/$apk_name"
          (
            cd signed-apk
            sha256sum "$apk_name" > "$apk_name.sha256"
          )
          {
            echo "SIGNED_APK=signed-apk/$apk_name"
            echo "SIGNED_APK_CHECKSUM=signed-apk/$apk_name.sha256"
          } >> "$GITHUB_ENV"

      - name: Upload bundle smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immersion-bundles-${{ github.sha }}
          path: |
            dist-native/**
            dist-ios/**
          if-no-files-found: error
          retention-days: 7

      - name: Upload signed APK
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.head_ref == 'agent/apk-build')
        uses: actions/upload-artifact@v4
        with:
          name: immersion-signed-apk-${{ github.sha }}
          path: signed-apk/**
          if-no-files-found: error
          retention-days: 30

      - name: Summarize validation
        if: always()
        shell: bash
        run: |
          {
            echo '## Immersion validation'
            echo "- Commit: $GITHUB_SHA"
            echo "- Version: $(node -p "require('./package.json').version")"
            echo '- Checks: typecheck/tests, lint, Expo Doctor, Android export, iOS export.'
            if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" || "$GITHUB_EVENT_NAME" == "schedule" || ( "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ) || ( "$GITHUB_EVENT_NAME" == "pull_request" && "$GITHUB_HEAD_REF" == "agent/apk-build" ) ]]; then
              echo '- Android APK: signed release APK and SHA-256 uploaded as a 30-day Actions artifact.'
            else
              echo '- Android APK: skipped; signing secrets are not exposed to ordinary PRs or non-main branches.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove temporary signing key
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/immersion-upload.p12"
