name: Validate app

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Expo app
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and tests
        run: npm run verify

      - name: Lint source
        run: npm run lint

      - name: Check Expo project health
        run: npm run doctor

      - name: Export Android and iOS bundles
        run: |
          npx expo export --platform android --output-dir dist-native --clear
          npx expo export --platform ios --output-dir dist-ios --clear

      - name: Upload bundle smoke artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immersion-bundles-${{ github.sha }}
          path: |
            dist-native/**
            dist-ios/**
          if-no-files-found: error
          retention-days: 7

      - name: Summarize validation
        if: always()
        run: |
          {
            echo '## Immersion validation'
            echo "- Commit: $GITHUB_SHA"
            echo "- Version: $(node -p "require('./package.json').version")"
            echo '- Checks: typecheck/tests, lint, Expo Doctor, Android export, iOS export.'
            echo '- Signing is intentionally reserved for tag-triggered Release workflow.'
          } >> "$GITHUB_STEP_SUMMARY"
