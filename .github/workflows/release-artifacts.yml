name: Build release artifacts

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-artifacts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and build release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and tests
        run: npm run verify

      - name: Lint source
        run: npm run lint

      - name: Check Expo project health
        run: npm run doctor

      - name: Export Android and iOS bundles
        run: |
          npx expo export --platform android --output-dir dist-native --clear
          npx expo export --platform ios --output-dir dist-ios --clear

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Generate Android native project
        run: npx expo prebuild --platform android --no-install

      - name: Build Android release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: immersion-release-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            dist-native/**
            dist-ios/**
          if-no-files-found: error
          retention-days: 14

      - name: Summarize generated files
        if: always()
        run: |
          {
            echo '## Immersion release artifacts'
            echo "- Commit: $GITHUB_SHA"
            echo "- Version: $(node -p "require('./package.json').version")"
            echo '- Android APK: generated with the default debug keystore; use EAS/store signing for distribution.'
            echo '- Expo bundles: Android and iOS exports are included in the uploaded artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
